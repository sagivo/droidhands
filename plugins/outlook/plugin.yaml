# yaml-language-server: $schema=../plugin.schema.json
id: outlook
name: Microsoft Outlook
description: Microsoft's email and calendar app for Outlook.com, Microsoft 365 and other accounts.
category: email
homepage: https://www.microsoft.com/microsoft-365/outlook
status: experimental
android:
  packages: [com.microsoft.office.outlook]

actions:
  - id: send_email
    title: Send an email
    description: >-
      Sends an email from Outlook to email addresses (to) or a contact saved on the phone (contact), using the
      built-in email_send tool with Outlook. The user may have to approve it on the phone; the prompt shows the
      resolved recipients. With PhoneBridge accessibility on, it fills in Outlook's compose screen, checks it and
      taps Send (sent=true). Without it, or if Send can't be found, the draft is left open and nothing is sent.
    keywords: [email, mail, outlook, message, write]
    params:
      to:
        description: Recipient email address(es), comma-separated. Pass either to or contact.
        max_length: 2000
      contact:
        description: Name of a contact saved on the phone, resolved to their email address (instead of to)
        max_length: 100
      cc:
        description: Cc email address(es), comma-separated
        max_length: 2000
      subject:
        description: Subject line
        max_length: 500
      body:
        description: The email text
        required: true
        max_length: 10000
    android:
      tool:
        name: email_send
        args:
          to: "{{to}}"
          contact: "{{contact}}"
          cc: "{{cc}}"
          subject: "{{subject}}"
          body: "{{body}}"
          app: com.microsoft.office.outlook
    examples:
      - params: {to: dana@contoso.com, subject: Report, body: "Here is the summary."}
        expect:
          tool:
            name: email_send
            args: {to: dana@contoso.com, subject: Report, body: "Here is the summary.", app: com.microsoft.office.outlook}
      - params: {subject: Report}
        expect: {error: body}

  - id: compose
    title: Write an email
    description: >-
      Opens Outlook's compose screen with the recipients, subject and text filled in. Nothing is sent: the user
      (or you, with screen_read and ui_tap) must tap Send. Use send_email to send it with the user's approval.
    keywords: [email, mail, draft, compose, prefill, write, new]
    risk: action
    params:
      to:
        description: Recipient email address(es), comma-separated, e.g. dana@contoso.com
        max_length: 2000
      subject:
        description: Subject line
        max_length: 500
      body:
        description: The email text
        max_length: 10000
    completes: false
    android:
      intent:
        action: android.intent.action.SENDTO
        data: "mailto:{{to}}?subject={{subject}}&body={{body}}"
    examples:
      - params: {to: dana@contoso.com, subject: Q3 plan, body: Draft attached}
        expect:
          intent:
            action: android.intent.action.SENDTO
            package: com.microsoft.office.outlook
            data: "mailto:dana%40contoso.com?subject=Q3%20plan&body=Draft%20attached"
