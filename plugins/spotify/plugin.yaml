# yaml-language-server: $schema=../plugin.schema.json
id: spotify
name: Spotify
description: Music and podcast streaming.
category: music
homepage: https://www.spotify.com
status: experimental
android:
  packages: [com.spotify.music]
ios:
  bundle_ids: [com.spotify.client]

actions:
  - id: play
    title: Play music
    description: >-
      Searches Spotify and starts playing the best match: a song, artist, album, playlist or podcast.
      Spotify picks the match; use search first if the user wants to choose.
    keywords: [music, song, listen, playlist, podcast, artist, album]
    risk: action
    params:
      query:
        description: What to play, e.g. "Bohemian Rhapsody" or "lofi beats playlist"
        required: true
        max_length: 200
    confirm: Play "{{query}}" on Spotify
    completes: true
    android:
      intent:
        action: android.media.action.MEDIA_PLAY_FROM_SEARCH
        extras:
          query: "{{query}}"
          android.intent.extra.focus: vnd.android.cursor.item/*
    examples:
      - params: {query: lofi beats}
        expect:
          intent:
            action: android.media.action.MEDIA_PLAY_FROM_SEARCH
            package: com.spotify.music
            extras: {query: lofi beats, android.intent.extra.focus: vnd.android.cursor.item/*}
      - params: {}
        expect: {error: query}

  - id: search
    title: Search
    description: Opens Spotify's search results for a query, without playing anything.
    keywords: [find]
    risk: action
    params:
      query: {description: Search text, required: true, max_length: 200}
    android:
      url: "spotify:search:{{query}}"
    examples:
      - params: {query: daft punk}
        expect: {url: "spotify:search:daft%20punk"}

  - id: open_item
    title: Open a track, album, playlist or podcast
    description: >-
      Opens one item in Spotify by its type and Spotify ID, the 22-character code in open.spotify.com links and
      spotify: URIs (from https://open.spotify.com/album/0sNOF9WDwhWunNAHPD3Baj use type album and id
      0sNOF9WDwhWunNAHPD3Baj). It shows the item's page; playback may not start by itself. Use play to play by name.
    keywords: [link, uri, track, song, album, playlist, artist, podcast, episode, show]
    risk: action
    params:
      type:
        description: What kind of item the ID is for.
        required: true
        enum: [track, album, artist, playlist, show, episode]
      id:
        description: The 22-character Spotify ID, e.g. 0sNOF9WDwhWunNAHPD3Baj
        required: true
        pattern: "^[0-9A-Za-z]{22}$"
    confirm: Open Spotify {{type}} {{id}}
    android:
      url: "https://open.spotify.com/{{type}}/{{id}}"
    ios:
      url: "spotify:{{type}}:{{id}}"
    examples:
      - params: {type: album, id: 0sNOF9WDwhWunNAHPD3Baj}
        expect: {url: "https://open.spotify.com/album/0sNOF9WDwhWunNAHPD3Baj"}
      - os: ios
        params: {type: album, id: 0sNOF9WDwhWunNAHPD3Baj}
        expect: {url: "spotify:album:0sNOF9WDwhWunNAHPD3Baj"}
      - params: {type: playlist, id: "spotify:playlist:37i9dQZF1DXcBWIGoYBM5M"}
        expect: {error: id}
      - params: {type: song, id: 0sNOF9WDwhWunNAHPD3Baj}
        expect: {error: type}
