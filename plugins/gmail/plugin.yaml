# yaml-language-server: $schema=../plugin.schema.json
id: gmail
name: Gmail
description: Google's email app.
category: email
homepage: https://mail.google.com
status: experimental
android:
  packages: [com.google.android.gm]

actions:
  - id: compose
    title: Write an email
    description: >-
      Opens Gmail's compose screen with the recipients, subject and text filled in. Nothing is sent: the user (or
      you, with screen_observe and ui_tap) must tap Send; check the screen afterwards to confirm it went out.
    keywords: [email, mail, draft, compose, prefill, write, new]
    risk: action
    params:
      to:
        description: Recipient email address(es), comma-separated, e.g. dana@example.com
        max_length: 2000
      subject:
        description: Subject line
        max_length: 500
      body:
        description: The email text
        max_length: 10000
    completes: false
    android:
      intent:
        action: android.intent.action.SENDTO
        data: "mailto:{{to}}?subject={{subject}}&body={{body}}"
    examples:
      - params: {to: dana@example.com, subject: Hello there, body: "Line one\nLine two"}
        expect:
          intent:
            action: android.intent.action.SENDTO
            package: com.google.android.gm
            data: "mailto:dana%40example.com?subject=Hello%20there&body=Line%20one%0ALine%20two"
      - params: {}
        expect:
          intent: {data: "mailto:?subject=&body="}
