# yaml-language-server: $schema=../plugin.schema.json
id: samsung_internet
name: Samsung Internet
description: Samsung's web browser.
category: browser
status: experimental
android:
  # The release build only: open_url pins this exact package (the beta has its own).
  packages: [com.sec.android.app.sbrowser]

actions:
  - id: open_url
    title: Open a web page
    description: >-
      Opens a web page in Samsung Internet (not in another browser or app), given its full http:// or https://
      address. It only loads the page; nothing on it is clicked or submitted.
    keywords: [web, website, page, link, url, browse, internet, open site]
    params:
      url:
        description: The full address, starting with https:// or http://, e.g. https://www.samsung.com
        required: true
        max_length: 2000
        pattern: '^https?://\S+$'
    android:
      tool:
        name: url_open
        args: {url: "{{url}}", package: com.sec.android.app.sbrowser}
    examples:
      - params: {url: "https://www.samsung.com"}
        expect:
          tool: {name: url_open, args: {url: "https://www.samsung.com", package: com.sec.android.app.sbrowser}}
      - params: {url: samsung.com}
        expect: {error: url}

  - id: search_google
    title: Search Google
    description: >-
      Opens Google search results for a query in Samsung Internet. It always searches Google, whatever the
      browser's default search engine is. Nothing else is opened until someone taps a result.
    keywords: [search, web search, google, look up, find, internet]
    risk: action
    params:
      query:
        description: What to search for.
        required: true
        max_length: 500
    confirm: Search Google for "{{query}}" in Samsung Internet
    android:
      url: "https://www.google.com/search?q={{query}}"
    examples:
      - params: {query: weather in Paris}
        expect: {url: "https://www.google.com/search?q=weather%20in%20Paris"}
      - params: {}
        expect: {error: query}
