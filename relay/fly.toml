# Fly.io deployment of the PhoneBridge relay. From the relay/ directory:
#
#   fly launch --copy-config --no-deploy --name <your-app-name>
#   fly secrets set RELAY_ACCESS_KEY="$(openssl rand -base64 32)" RELAY_SECRET="$(openssl rand -base64 32)"
#   fly deploy --ha=false
#   fly logs          # prints the phone setup link (and a QR code)
#
# PUBLIC_URL defaults to https://<app>.fly.dev (from FLY_APP_NAME); set it for a custom domain.
# Keep exactly one machine: connected phones and pending pairings live in memory.

app = "phonebridge-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8787
  force_https = true
  # Phones hold a long-lived WebSocket; a stopped machine would drop them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
