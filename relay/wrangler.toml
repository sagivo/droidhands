# DroidHands relay on Cloudflare Workers + Durable Objects (see CLOUDFLARE.md).
#   npm run cf:dev       local, on http://127.0.0.1:8787 (needs RELAY_SECRET in .dev.vars)
#   npm run cf:deploy    to your Cloudflare account (needs `npx wrangler secret put RELAY_SECRET`)
name = "droidhands-relay"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
# node:crypto and Buffer for the modules shared with the Node relay.
compatibility_flags = ["nodejs_compat"]

# A custom domain instead of *.workers.dev (the zone must be on your Cloudflare account).
# workers.dev stays on for phones whose APK was built with the workers.dev URL; with PUBLIC_URL
# set, every URL the relay hands out (connect URLs, OAuth metadata, setup link) uses the domain.
routes = [{ pattern = "connect.droidhands.com", custom_domain = true }]
workers_dev = true

# One Durable Object per phone. SQLite-backed, so it runs on the Workers Free plan.
[[durable_objects.bindings]]
name = "DEVICES"
class_name = "DeviceObject"

# With ACCOUNTS_URL, the relay fetches the API server's public keys through this binding (no
# trip over the internet). Uncomment once the droidhands-api Worker is deployed: a binding to a
# Worker that doesn't exist fails the deploy.
# [[services]]
# binding = "ACCOUNTS"
# service = "droidhands-api"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceObject"]

[vars]
# Public base URL (https://relay.example.com). Leave empty to use the address each request was
# sent to (e.g. https://droidhands-relay.<account>.workers.dev or your custom domain).
PUBLIC_URL = "https://connect.droidhands.com"
# Origins (comma-separated, or *) of browser-based MCP clients allowed to call the MCP endpoints.
ALLOWED_ORIGINS = ""
# Where the setup page's "Install DroidHands" button points, e.g. the APK of a GitHub release.
APK_URL = ""
# Log the setup link (and a QR code) once per isolate. It contains RELAY_ACCESS_KEY when one is
# set, and deployed Worker logs may be kept by Cloudflare, so it is off by default.
SETUP_BANNER = "false"
# Require a DroidHands account (docs/PROTOCOL.md §7): phones must show a relay token signed by this
# API server (api/). Empty = anyone's phone may connect. Turning it on refuses every phone
# without a signed-in app, so deploy api/ and ship the app with sign-in first.
ACCOUNTS_URL = ""
# Secrets (never put them here): `npx wrangler secret put RELAY_SECRET`, and optionally
# `npx wrangler secret put RELAY_ACCESS_KEY` to keep strangers' phones off your relay.

# The relay shares its config module with the Node relay, which computes a default file path from
# import.meta.url at load time; Workers have no file system, so give it a harmless constant.
[define]
"import.meta.url" = "\"file:///droidhands-relay/src/worker/index.js\""

[observability]
enabled = true
# Cloudflare records each request's URL in Workers Logs. Pairing page URLs carry a page token in
# the query (and authorize URLs the client's state), so keep query strings out of the logs. The relay
# logs its own events (status, device tag, client address) without URLs, tokens or bodies.
# With ALLOW_TOKEN_IN_URL=true the agent token is in the URL *path* (/mcp/<token>), which this does
# not redact: leave that setting off here, or set `logs = { invocation_logs = false }`.
redact_query_string = true
