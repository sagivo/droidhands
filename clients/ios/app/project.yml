# DroidHands for iPhone, the App Store app. Generate the Xcode project with `xcodegen generate`
# (scripts/ios-app.sh and scripts/store-release.sh do).
name: DroidHands
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Overridden by scripts/store-release.sh from the git tag (v1.2.3 → 1.2.3, build 10203).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # scripts/store-release.sh passes IOS_APP_BUNDLE_ID to use another one.
    PB_APP_BUNDLE_ID: com.droidhands.ios
    # The relay a fresh install connects to (Settings › Connection changes it on the phone).
    DROIDHANDS_DEFAULT_RELAY_URL: https://connect.droidhands.com
    # iPhone only for now (iPad runs it in compatibility mode); "1,2" also needs iPad screenshots.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  DroidHands:
    type: application
    platform: iOS
    sources:
      - path: DroidHands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PB_APP_BUNDLE_ID)
        PRODUCT_NAME: DroidHands
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: DroidHands/Resources/DroidHands.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DroidHands/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: DroidHands
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSContactsUsageDescription: Your AI agents can look up people in your contacts when you allow it, for example to find the number to call.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Your AI agents can read your calendar and add events when you allow it.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Your AI agents can add events to your calendar when you allow it.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Your AI agents can read your reminders and add new ones when you allow it.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your AI agents can ask where this iPhone is when you allow it, for example to find places nearby.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  DroidHandsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DroidHandsTests]
    dependencies:
      - target: DroidHands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PB_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DroidHands.app/DroidHands
        BUNDLE_LOADER: $(TEST_HOST)
  DroidHandsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DroidHandsUITests]
    dependencies:
      - target: DroidHands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PB_APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DroidHands
schemes:
  DroidHands:
    build:
      targets:
        DroidHands: all
        DroidHandsTests: [test]
        DroidHandsUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DroidHandsTests
        - DroidHandsUITests
