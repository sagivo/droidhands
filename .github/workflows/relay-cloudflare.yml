# Tests the relay (Node and Cloudflare Worker, plus the shared conformance suite against both) and
# deploys the Worker to Cloudflare (relay/CLOUDFLARE.md). The deploy runs only when the repository
# has the CLOUDFLARE_API_TOKEN secret (and CLOUDFLARE_ACCOUNT_ID); otherwise it is skipped.
name: Relay (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: relay-cloudflare-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: relay

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Node relay tests
        run: npm test
      - name: Worker type-check and tests (workerd)
        run: npm run test:worker
      - name: Conformance suite against the Node relay
        run: npm run conformance:node
      - name: Conformance suite against the Worker (wrangler dev --local)
        run: npm run conformance:worker
        env:
          WRANGLER_SEND_METRICS: 'false'

  deploy:
    needs: test
    # A manual run on another branch tests it but never deploys it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets cannot be tested in a job-level `if`; the first step decides.
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the relay (see relay/CLOUDFLARE.md)."
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.creds.outputs.deploy == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.creds.outputs.deploy == 'true'
      - name: Deploy the Worker
        id: deploy
        if: steps.creds.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
      - name: Health check
        if: steps.creds.outputs.deploy == 'true' && steps.deploy.outputs.deployment-url != ''
        env:
          RELAY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o body.txt -w '%{http_code}' "$RELAY_URL/healthz" || true)
            if [ "$status" = "200" ]; then echo "relay healthy at $RELAY_URL"; exit 0; fi
            sleep 5
          done
          echo "::warning title=Relay not healthy::$RELAY_URL/healthz answered $status: $(head -c 300 body.txt 2>/dev/null). Is RELAY_SECRET set? (npx wrangler secret put RELAY_SECRET)"
        working-directory: .
