# Publishes a release when a version tag is created: by publishing a release with a new tag v1.2.3 on GitHub
# (Releases › Draft a new release), or with git tag v1.2.3 && git push origin v1.2.3:
#
#   1. the full edition's signed APK (docs/EDITIONS.md: with phone use) on the GitHub Release, as DroidHands-1.2.3.apk
#      and DroidHands.apk (so
#      https://github.com/sagivo/droidhands/releases/latest/download/DroidHands.apk always serves the
#      newest one), plus SHA256SUMS;
#   2. the relay image ghcr.io/sagivo/droidhands-relay:1.2.3 and :latest;
#   3. the store edition's App Bundle (no accessibility service, for Play's Accessibility API policy) on Google Play
#      (production track unless the variable PLAY_TRACK says otherwise), only while the variable PLAY_PUBLISH is
#      true (docs/RELEASING.md says when to turn it on);
#   4. the iPhone app on App Store Connect, submitted for App Review and released once Apple approves it
#      (TestFlight only when the variable APP_STORE_SUBMIT is false).
#
# The store "What's new" text comes from the release's "## What's new" section (or its whole text). Every job
# can be re-run: what a store already has is left alone. Secrets and the one-time store setup are listed in
# docs/RELEASING.md ("Automatic releases"). A release is never signed with a debug key. The optional repository
# variable DROIDHANDS_RELAY_URL becomes the app's default relay, and DROIDHANDS_API_URL the accounts server
# that relay needs a sign-in with (docs/PROTOCOL.md §7); unset, the Android and iPhone store builds have no
# accounts, which their store listings and privacy answers assume.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Signed APK on the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (minor and patch at most 99), got '$TAG'."
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          code=$(( major * 10000 + minor * 100 + patch ))
          if (( code < 1 )); then
            echo "::error::v0.0.0 can't be released (Android needs a versionCode of at least 1)."
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $major.$minor.$patch, versionCode $code"

      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Releases are never signed with a debug key. Create the key and secrets with scripts/make-release-key.sh (docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes 'tools', which the SDK no longer has (sdkmanager fails).
          # Gradle downloads the platform and build tools it needs.
          packages: platform-tools

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          chmod 600 "$keystore"
          echo "PB_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Default relay
        env:
          RELAY_URL: ${{ vars.DROIDHANDS_RELAY_URL }}
        run: |
          if [ -n "$RELAY_URL" ]; then
            echo "::notice::This release goes online through $RELAY_URL on first run (repository variable DROIDHANDS_RELAY_URL)."
          else
            echo "::notice::No repository variable DROIDHANDS_RELAY_URL: this release has no default relay, and users connect their own."
          fi

      - name: Test both editions and build the full edition's signed release APK
        working-directory: clients/android
        env:
          PB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DROIDHANDS_DEFAULT_RELAY_URL: ${{ vars.DROIDHANDS_RELAY_URL }}
          DROIDHANDS_API_URL: ${{ vars.DROIDHANDS_API_URL }}
          # GITHUB_REPOSITORY (set by Actions) becomes BuildConfig.GITHUB_REPO for the in-app update check.
        run: >-
          ./gradlew :core:test :core:checkPlugins :app:testFullDebugUnitTest :app:testStoreDebugUnitTest :app:assembleFullRelease
          -Pdroidhands.versionName=${{ steps.version.outputs.name }}
          -Pdroidhands.versionCode=${{ steps.version.outputs.code }}
          -Pdroidhands.requireReleaseSigning=true
          --console=plain --stacktrace

      - name: Verify the signature and collect the files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="clients/android/app/build/outputs/apk/full/release/DroidHands-$VERSION.apk"
          test -f "$apk" || { echo "::error::$apk was not built"; exit 1; }
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with a debug key. Refusing to publish it."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/DroidHands-$VERSION.apk"
          cp "$apk" dist/DroidHands.apk
          (cd dist && sha256sum "DroidHands-$VERSION.apk" DroidHands.apk > SHA256SUMS && cat SHA256SUMS)
          rm -f "$PB_KEYSTORE_PATH"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DroidHands ${{ steps.version.outputs.name }}
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            dist/DroidHands-${{ steps.version.outputs.name }}.apk
            dist/DroidHands.apk
            dist/SHA256SUMS

  relay-image:
    name: Relay image on GHCR
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Test the relay
        working-directory: relay
        run: npm ci --no-audit --no-fund && npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        # GHCR names must be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/droidhands-relay" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.apk.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=droidhands-relay
            org.opencontainers.image.description=DroidHands relay: lets AI agents reach a DroidHands phone from anywhere

      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  google-play:
    name: Google Play
    needs: apk
    if: vars.PLAY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check the Google Play secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing the repository secret PLAY_SERVICE_ACCOUNT_JSON (the Play service account's JSON key). See docs/RELEASING.md, \"Automatic releases\"."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Keys and release notes
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | node scripts/release-notes.mjs --max 500 > "$RUNNER_TEMP/notes.txt"
          echo "Release notes for Google Play:"; cat "$RUNNER_TEMP/notes.txt"; echo

      - name: Build and publish on Google Play
        env:
          PB_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play.json
          DROIDHANDS_DEFAULT_RELAY_URL: ${{ vars.DROIDHANDS_RELAY_URL }}
          DROIDHANDS_API_URL: ${{ vars.DROIDHANDS_API_URL }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'production' }}
        # The apk job already ran the tests on this commit.
        run: >-
          ./scripts/store-release.sh android --version "${{ needs.apk.outputs.version }}" --track "$PLAY_TRACK"
          --yes --skip-tests --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/play.json"

  app-store:
    name: App Store
    needs: apk
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check the App Store secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/RELEASING.md, \"Automatic releases\"."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Newest Xcode
        # App Store Connect only takes builds made with a recent SDK; the image's default Xcode can lag.
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' ! -iname '*beta*' | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - run: brew install xcodegen

      - name: Keys and release notes
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | node scripts/release-notes.mjs --max 500 > "$RUNNER_TEMP/notes.txt"
          echo "What's New on the App Store:"; cat "$RUNNER_TEMP/notes.txt"; echo

      - name: Build, upload and submit for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12: ${{ runner.temp }}/distribution.p12
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          DROIDHANDS_DEFAULT_RELAY_URL: ${{ vars.DROIDHANDS_RELAY_URL }}
          DROIDHANDS_API_URL: ${{ vars.DROIDHANDS_API_URL }}
          SUBMIT: ${{ vars.APP_STORE_SUBMIT != 'false' && '--submit' || '' }}
        run: >-
          ./scripts/store-release.sh ios --version "${{ needs.apk.outputs.version }}" ${SUBMIT:+"$SUBMIT"} --wait-minutes 90
          --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/distribution.p12"
