# Tests and builds on every push and pull request: the Android core and app (unit tests, plugin
# checks, debug APK) and the relay (tests, build). No secrets are used.
name: CI

on:
  push:
    # Branches only: release tags are built by release.yml.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (core + app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Unit tests, plugin checks and debug build
        run: ./gradlew :core:test :core:checkPlugins :app:testDebugUnitTest :app:assembleDebug --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            clients/android/core/build/reports/tests/
            clients/android/app/build/reports/tests/
          retention-days: 7

  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
