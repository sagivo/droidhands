# Issue forms: "App integration" (also opened from the app: Apps > (an app) > Request a better integration) and
# "Bug report". Blank issues stay available for questions and ideas.
#
# Security problems are reported privately, never as issues (docs/SECURITY.md#reporting-a-vulnerability). A fork
# that publishes its own builds can add its private advisory link here, e.g.:
#   contact_links:
#     - name: Report a security vulnerability
#       url: https://github.com/sagivo/droidhands/security/advisories/new
#       about: Privately, so it can be fixed before it is public.
blank_issues_enabled: true
